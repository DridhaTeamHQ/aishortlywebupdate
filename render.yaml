services:
  # Next.js Dashboard
  - type: web
    name: shortly-dashboard
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Core Python Playwright Worker
  - type: worker
    name: shortly-worker
    env: python
    rootDir: .
    buildCommand: pip install --prefer-binary -r requirements.txt && playwright install --with-deps chromium
    startCommand: python worker.py
    plan: starter
    envVars:
      - key: SUPABASE_URL
        fromService:
          type: web
          name: shortly-dashboard
          envVarKey: NEXT_PUBLIC_SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: shortly-dashboard
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: CMS_URL
        sync: false
      - key: CMS_EMAIL
        sync: false
      - key: CMS_PASSWORD
        sync: false
      - key: WORKER_POLL_INTERVAL
        value: "5"
      - key: AI_AGENT_REPO_PATH
        value: .
