providers = ["python"]

[phases.setup]
nixPkgs = ["python3", "gcc"]
aptPkgs = [
  # X11 / virtual display
  "xvfb",
  "x11-xkb-utils",
  "xfonts-base",
  "xfonts-cyrillic",
  # Chromium system libraries (Ubuntu 24.04 Noble names)
  "libatk1.0-0t64",
  "libatk-bridge2.0-0t64",
  "libcairo2",
  "libcups2t64",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libglib2.0-0t64",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcb-dri3-0",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "libxrender1",
  "libxshmfence1",
  "libasound2t64",
  "libatspi2.0-0t64",
  # Fonts
  "fonts-liberation",
  "fonts-freefont-ttf",
  "fonts-noto-color-emoji",
]

[phases.build]
cmds = [
  "pip install --prefer-binary -r requirements.txt",
  "playwright install chromium",
]
